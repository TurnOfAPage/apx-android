name: orient-refactor
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply text patches
        run: python3 .github/scripts/orient_refactor.py
      - name: Commit and push branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -B feat/orient-layout-split
          git add -A
          git diff --cached --quiet && { echo "no changes produced"; exit 1; }
          git commit -m "feat: 旋转只换布局不切页；状态页并入设置（顶栏分页）；键盘页转正底栏"
          git push --force origin feat/orient-layout-split
