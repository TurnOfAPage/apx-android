name: AI Edit Channel
# 临时通道（改完即删）：把 edits.json 推到 .github/ci-patches/ 即自动应用到本分支。
# 方式是"精确匹配→替换"：每条 find 必须命中指定次数，两遍校验、先全部 check 再统一写盘；
# 不匹配就红，绝不半成品落盘。用于改动面太大、无法整文件重写的场景（如 31K 的 SettingsFragment.kt）。
on:
  push:
    branches: ['feat/settings-feedback-update']
    paths: ['.github/ci-patches/**']

permissions:
  contents: write

concurrency:
  group: ai-edit-${{ github.ref }}
  cancel-in-progress: false

jobs:
  apply:
    #防自触发循环：应用方自己的提交固定用 "apply: ai-edit" 开头
    if: ${{ !startsWith(github.event.head_commit.message, 'apply: ai-edit') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
      - name: Apply edits.json
        run: python3 .github/ci-patches/apply.py
      - name: Commit applied edits
        run: |
          if git status --porcelain | grep -q .; then
            git config user.name "ai-edit-bot"
            git config user.email "ai-edit-bot@users.noreply.github.com"
            git add -A
            git commit -m "apply: ai-edit — 应用 edits.json"
            git push
            echo "applied"
          else
            echo "no changes"
          fi
