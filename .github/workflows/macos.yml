name: macOS Build

# macOS 端（mac-port 分支）编译验证：
#   push mac-port / master —— 构建 apxhost + apxdisp（P0：CLI 宿主，不含 GUI）
#   pull_request→master   —— 合入前拦下编译错误
#   workflow_dispatch      —— 手动触发

on:
  push:
    branches: [master, mac-port]
  pull_request:
    branches: [master]
  workflow_dispatch:

jobs:
  mac:
    name: build (macOS)
    runs-on: macos-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure (CMake)
        run: |
          cmake -S pc/host -B build_host \
            -DCMAKE_BUILD_TYPE=Release \
            -DAPXPC_BUILD_UI=OFF \
            -DAPXPC_BUILD_TESTS=OFF \
            -DAPXDISP_BUILD_TESTS=OFF

      - name: Build (apxhost + apxdisp)
        run: cmake --build build_host -j4 --target apxhost apxdisp

      - name: Show errors on failure
        if: failure()
        # 1) make -k 跑完所有编译单元，一次暴露全部错误（省 CI 迭代轮次）
        # 2) 错误行转成 ::error 注解 —— 注解走 check-runs/annotations API（免鉴权可读），
        #    因为 job logs 端点需要写权限，外部拉不到
        run: |
          set +e
          cmake --build build_host -j1 --target apxhost apxdisp -- -k > /tmp/full.log 2>&1
          grep -E "(error:|Undefined symbols|symbol not found|fatal error)" /tmp/full.log \
            | head -50 | sed 's/^/::error /'
          echo "=========== BUILD FAILED (tail 120) ==========="
          tail -120 /tmp/full.log
