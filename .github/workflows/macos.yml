name: macOS Build

# macOS 端（mac-port 分支）编译验证：
#   push mac-port / master —— 构建 apxhost（CLI 宿主 + 浏览器面板 panel_http）
#                              + apxdesktop（桌面壳，mac=HTTP 面板宿主，mac-desktop 起纳入 CI）
#   push tag v*           —— 同上构建，并把 zip 重命名为 AllPeriph-<tag>-macos-arm64.zip
#                            上传到对应 GitHub Release（与 build.yml release job 双向幂等：
#                            谁先跑完谁建 Release，后到者 --clobber 追加/覆盖）
#   pull_request→master   —— 合入前拦下编译错误
#   workflow_dispatch      —— 手动触发
# 失败时：
#   1) make -k 全量报错
#   2) 完整日志尾部推到 ci-logs 分支（contents API 免鉴权可读，拿全现场）——先做，最可靠
#   3) ::error:: 注解（必须显式 :: 分隔符：消息里若含 std::nullptr_t 这类双冒号，
#      GitHub 会拿第一个 :: 当分隔符把消息截断；前缀写成 ::error:: 后第一个 :: 就是自己的）
# 成功时：
#   strip 后打包 apxhost/apxdesktop + web/ 前端 dist 为 zip 上传 artifact，
#   解压即用（./apxdesktop 或 ./apxhost panel 自动打开浏览器面板）

on:
  push:
    branches: [master, mac-port]
    tags: ['v*']
  pull_request:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: write   # 失败时推 ci-logs 分支；tag 构建时上传 Release 资产

jobs:
  mac:
    name: build (macOS)
    runs-on: macos-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build web frontend (Vite + React)
        # 浏览器面板的前端 dist：`apxhost panel` / `apxdesktop` 从 exe 旁 web/ 读取。
        # 用 npm install 而非 npm ci（不强依赖 package-lock.json，与 Windows 侧构建口径一致）
        run: |
          cd pc/web
          npm install
          npm run build

      - name: Configure (CMake)
        run: |
          cmake -S pc/host -B build_host \
            -DCMAKE_BUILD_TYPE=Release \
            -DAPXPC_BUILD_UI=OFF \
            -DAPXPC_BUILD_TESTS=OFF

      - name: Build (apxhost + apxdesktop)
        # apxdesktop：mac 桌面壳（desktop_main → runWebPanelHttp）。历史上 mac CI **只 build
        # apxhost**，desktop_main 的 mac 兼容性（share.h / 宿主栈符号面）从未过堂 —— 本步把它
        # 纳入编译，mac-desktop 起第一次真刀验证。
        # 注：tag 构建时 CMake 的发版段会从 GITHUB_REF_NAME 注入 APXPC_VERSION_STRING，
        # `apxhost --version` 即为 tag 号（与 build.yml 三端同源逻辑一致）。
        run: cmake --build build_host -j4 --target apxhost apxdesktop

      - name: Package (strip + web dist + zip)
        if: success()
        run: |
          cd build_host
          strip apxhost || true
          strip apxdesktop || true
          STAGE=apxhost-macos-arm64
          mkdir -p "$STAGE/web"
          cp apxhost "$STAGE/"
          cp apxdesktop "$STAGE/"
          cp -r ../pc/web/dist/. "$STAGE/web/"
          printf '%s\n' \
            "全能外设 macOS（arm64，未签名）" \
            "" \
            "快速上手：" \
            "  ./apxdesktop         桌面壳（自动打开浏览器面板，自带 9511 受控端）" \
            "  ./apxhost panel       浏览器控制面板（自动打开 http://127.0.0.1:…/?host=1）" \
            "  ./apxhost serve       无界面常驻服务（9511 受控 + 热键）" \
            "  ./apxhost list        枚举设备与传感器" \
            "  ./apxhost --help      全部命令" \
            "" \
            "首次打开（未签名应用）：" \
            "  系统设置 → 隐私与安全性 → 底部「仍要打开」" \
            "  或执行：xattr -dr com.apple.quarantine ./apxhost ./apxdesktop" \
            "" \
            "浏览器面板要求 web/ 目录与可执行文件同级（本包已附带）。" \
            "音箱首次使用需授权「系统音频录制」（系统设置 → 隐私与安全性）。" \
            > "$STAGE/README.txt"
          zip -9 -r apxhost-macos-arm64.zip "$STAGE"
          shasum -a 256 apxhost-macos-arm64.zip | tee apxhost-macos-arm64.zip.sha256

      - name: Upload artifact
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: apxhost-macos-arm64
          path: |
            build_host/apxhost-macos-arm64.zip
            build_host/apxhost-macos-arm64.zip.sha256
          retention-days: 30

      - name: Upload to GitHub Release (tag builds only)
        # tag 构建时把 zip 重命名为与 Windows/Android 资产同风格的
        # AllPeriph-<tag>-macos-arm64.zip 并上传：
        #   · build.yml 的 release job（needs pc+android，通常更慢）可能还没建 Release ——
        #     不存在则本步先建（标题占位，随后 build.yml 的 softprops 会同 tag 合并更新正文）；
        #     已存在则直接 --clobber 追加 —— 两条路径都幂等，先跑谁都不冲突。
        if: success() && startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="${GITHUB_REF_NAME}"
          cd build_host
          cp apxhost-macos-arm64.zip "AllPeriph-${TAG}-macos-arm64.zip"
          shasum -a 256 "AllPeriph-${TAG}-macos-arm64.zip" > "AllPeriph-${TAG}-macos-arm64.zip.sha256"
          ASSETS="AllPeriph-${TAG}-macos-arm64.zip AllPeriph-${TAG}-macos-arm64.zip.sha256"
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" $ASSETS --clobber
          else
            gh release create "$TAG" $ASSETS \
              --title "全能外设 ${TAG}" \
              --notes "macOS 测试版资产已上传；Windows/Android 资产由 build.yml 随后补充。" \
              || true
            # 竞态兕底：若上面因 Release 已被 build.yml 抢建而失败，再试一次 upload
            gh release upload "$TAG" $ASSETS --clobber
          fi
          echo "mac 资产已进入 Release ${TAG}"

      - name: Publish errors on failure
        if: failure()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set +e
          cmake --build build_host -j1 --target apxhost apxdesktop -- -k > /tmp/full.log 2>&1

          # ---- 1) 全量日志尾部推到 ci-logs 分支（先做，不依赖后面的行） ----
          WORK=$(mktemp -d)
          cd "$WORK" || exit 1
          git init -q
          git remote add origin "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          if git fetch -q origin ci-logs; then
            git checkout -q -B ci-logs FETCH_HEAD
          else
            git checkout -q --orphan ci-logs
          fi
          mkdir -p errors
          tail -400 /tmp/full.log > "errors/run_${GITHUB_RUN_ID}.txt"
          git add -A
          git -c user.name="github-actions[bot]" -c user.email="41898282+github-actions[bot]@users.noreply.github.com" \
            commit -q -m "ci errors: run ${GITHUB_RUN_ID}" || exit 0
          git push -q origin HEAD:ci-logs && echo "errors -> ci-logs branch"

          # ---- 2) ::error:: 注解（净化 CR、截 400 字符；::error:: 显式分隔防消息被吞） ----
          grep -E "(error:|Undefined symbols|symbol not found|fatal error|no rule to make target)" /tmp/full.log \
            | tr -d '\r' | cut -c1-400 | sed 's/^/::error::/' | head -50
