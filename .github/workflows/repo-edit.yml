name: repo-edit

# 大文件锚点替换编辑器：MainActivity.kt（~111KB）等无法整文件回传时，
# 把小而精确的改动交给 Actions 云端执行。编辑内容在 .github/scripts/repo_edit.py，
# 每个锚点断言唯一命中，不匹配则本步骤失败 → 不产生提交。

on:
  workflow_dispatch:
    inputs:
      commit_message:
        description: "提交信息"
        required: true
        default: "chore: repo edit"

jobs:
  edit:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: apply edits
        run: python3 .github/scripts/repo_edit.py
      - name: commit and push
        env:
          COMMIT_MSG: ${{ inputs.commit_message }}
        run: |
          git config user.name "repo-edit[bot]"
          git config user.email "106110000+repo-edit[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "no changes"
            exit 0
          fi
          git commit -m "$COMMIT_MSG"
          git push
